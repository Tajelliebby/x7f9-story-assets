<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epigraph</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      color: #222;
      background: #fafafa;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    p {
      margin-bottom: 1.15em;
      text-indent: 1.5em;
    }
    p:first-of-type {
      text-indent: 0;
    }
    .epigraph {
      margin: 4rem auto;
      max-width: 480px;
      text-align: center;
      font-style: italic;
    }
    .epigraph p {
      text-indent: 0;
      margin-bottom: 0.4em;
    }
    .attribution {
      margin-top: 1.25rem;
      font-style: normal;
      text-align: right;
      font-size: 0.95em;
    }
    .closing {
      font-weight: bold;
      font-style: italic;
      text-indent: 0;
    }
    sup a {
      text-decoration: none;
      color: #555;
      font-weight: bold;
    }
    sup a:hover {
      color: #000;
    }
    .footnotes {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #ccc;
      font-size: 0.95em;
    }
    .footnotes p {
      text-indent: 0;
    }
  </style>
</head>
<body>

  <div class="epigraph">
    <p>We were one and the same</p>
    <p>Running like moths to the flame</p>
    <p class="attribution">— Starset, “Ricochet”</p>
  </div>

</body>
</html>
